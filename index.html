<style>
:root{

  --r:10px;

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--cocoa);line-height:1.7;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,248,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--blush-2)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:'Syne',serif;font-weight:700;letter-spacing:.28em;font-size:1.15rem;direction:ltr}
.brand small{display:block;font-size:.5rem;letter-spacing:.5em;color:var(--rose);font-weight:500;margin-top:-4px}
.cartbtn{position:relative;padding:8px 14px;border-radius:99px;background:var(--cocoa);color:#fff;font-weight:500;font-size:.95rem}
.cartbtn b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--gold);color:var(--cocoa);font-size:.8rem;margin-inline-start:6px;padding:0 5px}

/* hero */
.hero{background:var(--blush);padding:44px 0 56px;overflow:hidden}
.hero .wrap{display:grid;gap:28px;justify-items:center;text-align:center}
.ring{width:min(78vw,330px);aspect-ratio:1;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 40%,#fff3f1,var(--blush) 70%)}
.ring::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid var(--gold);opacity:.5;clip-path:polygon(0 0,100% 0,100% 55%,0 55%)}
.ring .wm{font-family:'Syne',serif;font-size:clamp(2rem,9vw,2.9rem);letter-spacing:.2em;direction:ltr;padding-inline-start:.2em}
.ring .sub{font-family:'Syne',serif;letter-spacing:.55em;font-size:.72rem;color:var(--rose);direction:ltr;margin-top:2px}
.ring .slogan{font-family:'Cairo',serif;font-size:1.35rem;color:var(--rose-d);margin-top:14px}
.hero p.lead{max-width:34ch;color:var(--muted);font-size:1.05rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:99px;background:var(--rose);color:#fff;font-weight:700;transition:background .2s}
.btn:hover{background:var(--rose-d)}
a.btn{text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--rose);color:var(--rose-d)}
.btn.wa{background:#1FA855}
.btn.wa:hover{background:#178a45}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:.9rem}
.btn.danger{background:var(--err)}

/* shop */
.tools{padding:26px 0 8px;display:grid;gap:14px}
.search{width:100%;padding:12px 18px;border-radius:99px;border:1.5px solid var(--blush-2);background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 16px;border-radius:99px;border:1.5px solid var(--blush-2);background:#fff;font-weight:500;font-size:.95rem}
.chip[aria-pressed=true]{background:var(--cocoa);border-color:var(--cocoa);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:12px 0 56px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--blush);text-align:start;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(143,81,72,.14)}
.card .ph{aspect-ratio:1;position:relative;background:var(--blush)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .info{padding:10px 12px 14px;display:grid;gap:2px}
.card .nm{font-weight:500;font-size:.97rem;line-height:1.4}
.card .pr{color:var(--rose-d);font-weight:700}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--cocoa);color:#fff;font-size:.75rem;padding:2px 10px;border-radius:99px}
.tag.low{background:var(--rose)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(58,37,35,.5);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px 28px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

.sheet h2{font-family:'Cairo',serif;font-size:1.6rem;color:var(--rose-d);margin-bottom:10px}
.xbtn{float:inline-end;width:36px;height:36px;border-radius:50%;background:var(--blush);font-size:1.2rem;line-height:1}
.gal .main{aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--blush)}
.gal .main img{width:100%;height:100%;object-fit:cover}

.opt{padding:6px 16px;border-radius:99px;border:1.5px solid var(--blush-2);background:#fff}
.opt[aria-pressed=true]{border-color:var(--rose);background:var(--rose);color:#fff}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--blush-2);border-radius:99px;background:#fff}

.qty span{min-width:30px;text-align:center;font-weight:700}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.msg{background:var(--blush);padding:10px 14px;border-radius:12px;margin:10px 0;font-size:.95rem}
.msg.err{background:#fbe0dd;color:var(--err)}

/* cart */
.line{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--blush)}
.line img{width:62px;height:62px;border-radius:12px;object-fit:cover}
.line .t{font-weight:500;line-height:1.35}

.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;padding:14px 0}
.f{display:grid;gap:4px;margin-bottom:12px}
.f input,.f textarea,.f select{padding:11px 14px;border-radius:12px;border:1.5px solid var(--blush-2);background:#fff;width:100%}

/* footer */

footer a{color:var(--gold)}
footer .fa{margin-top:8px;opacity:.6;font-size:.8rem;text-decoration:underline;cursor:pointer}

.adm.open{display:block}
.adm header{background:var(--cocoa);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.tabs{display:flex;gap:6px;padding:14px 16px 0;max-width:900px;margin:0 auto}
.tabs button{padding:8px 18px;border-radius:99px;background:var(--blush);font-weight:500}

.apane{max-width:900px;margin:0 auto;padding:16px}
.arow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--blush);border-radius:14px;padding:10px;margin-bottom:10px}

.upl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.upl .it{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden}
.upl .it img{width:100%;height:100%;object-fit:cover}
.upl .it button{position:absolute;top:2px;inset-inline-start:2px;background:var(--err);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.8rem}
.ord{background:#fff;border:1px solid var(--blush);border-radius:14px;padding:12px;margin-bottom:10px;font-size:.93rem}
.ord pre{white-space:pre-wrap;font-family:inherit;color:var(--muted);margin:6px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--cocoa);color:#fff;padding:10px 20px;border-radius:99px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.brand.ar{letter-spacing:0;direction:rtl;font-family:'Cairo',serif;font-size:1.45rem;font-weight:700;line-height:1.1}
.brand.ar small{letter-spacing:0;font-size:.68rem;font-family:'Cairo',sans-serif;color:var(--rose);margin-top:0}

.hero.band .strip{font-size:2rem;letter-spacing:.35em}
.hero.dark{background:var(--cocoa);color:#fff}
.hero.dark h1{color:var(--gold)}.hero.dark p.lead{color:var(--blush-2)}
.hero.dark .ring{background:transparent;border-color:var(--gold)}.hero.dark .ring .sub{color:var(--gold)}.hero.dark .ring .slogan{color:var(--blush)}

/* ============ أدوات ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('المساحة ممتلئة. جرّبي صور أصغر أو احذفي منتجات.');return false}};
const money=n=>`${Number(n).toLocaleString('en-US')} ${CFG.CURRENCY}`;
const priceTxt=p=>money(p.price)+(p.unit?' / '+p.unit:'');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)};
function placeholder(p){
  const hues={"نسائي": 313, "رجالي": 341, "أطفال": 9, "صنادل": 37};
  const h=(hues[p.cat]??350)+(p.id.length*7)%20, ic=ICONS[p.cat]||'👟';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},70%,93%)"/><stop offset="1" stop-color="hsl(${h},55%,82%)"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><circle cx="100" cy="100" r="62" fill="none" stroke="#F26A21" stroke-width="1.5"/><text x="100" y="122" font-size="64" text-anchor="middle">${ic}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
const imgs=p=>p.imgs&&p.imgs.length?p.imgs:[placeholder(p)];

/* ============ الحالة ============ */
let products=[], cart=lsGet('shoes_cart',[]), activeCat='الكل', query='';

async function load(){
  const draft=lsGet('shoes_draft',null);
  if(draft){products=draft}
  else{
    try{const r=await fetch('products.json?'+Date.now());if(!r.ok)throw 0;products=await r.json()}
    catch(e){products=DEFAULTS}
  }
  cart=cart.filter(c=>products.some(p=>p.id===c.pid));
  renderChips();renderGrid();renderCartCount();
}
const byId=id=>products.find(p=>p.id===id);

/* ============ واجهة المتجر ============ */
function renderChips(){
  const cats=['الكل',...new Set([...CATS,...products.map(p=>p.cat)].filter(c=>products.some(p=>p.cat===c)))];
  $('#chips').innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===activeCat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}
function renderGrid(){
  const list=products.filter(p=>(activeCat==='الكل'||p.cat===activeCat)&&(!query||(p.name+p.desc+p.cat).includes(query)));
  $('#grid').innerHTML=list.length?list.map(p=>{
    const out=p.qty<=0, low=!out&&p.qty<=3;
    return `<button class="card" data-pid="${esc(p.id)}"><div class="ph"><img src="${esc(imgs(p)[0])}" alt="${esc(p.name)}" loading="lazy">${out?'<span class="tag">نفدت الكمية</span>':low?`<span class="tag low">باقي ${p.qty}</span>`:''}</div><div class="info"><span class="nm">${esc(p.name)}</span><span class="pr">${priceTxt(p)}</span></div></button>`}).join('')
    :'<p class="empty">ما لقينا منتج بهذا الاسم. جرّبي كلمة ثانية أو تصنيف آخر.</p>';
}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;activeCat=b.dataset.cat;renderChips();renderGrid()});
$('#q').addEventListener('input',e=>{query=e.target.value.trim();renderGrid()});
$('#grid').addEventListener('click',e=>{const c=e.target.closest('[data-pid]');if(c)openProduct(c.dataset.pid)});

const open=id=>$('#'+id).classList.add('open'), close=id=>$('#'+id).classList.remove('open');
$$('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-close]'))o.classList.remove('open')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.ov.open').forEach(o=>o.classList.remove('open'))});

/* منتج */
let sel={opt:null,qty:1};
const optGroup=(lab,list,attr,cur)=>list&&list.length?`<span class="lbl">${esc(lab)}</span><div class="opts">${list.map(o=>`<button class="opt" data-${attr}="${esc(o)}" aria-pressed="${cur===o}">${esc(o)}</button>`).join('')}</div>`:'';
function openProduct(id){
  const p=byId(id);if(!p)return;
  sel={opt:p.options&&p.options.length===1?p.options[0]:null,opt2:p.options2&&p.options2.length===1?p.options2[0]:null,qty:1};
  const im=imgs(p);
  $('#prodBody').innerHTML=`<div class="pd"><div class="gal"><div class="main"><img id="gMain" src="${esc(im[0])}" alt="${esc(p.name)}"></div>${im.length>1?`<div class="thumbs">${im.map((s,i)=>`<button data-th="${i}" aria-current="${i===0}" aria-label="صورة ${i+1}"><img src="${esc(s)}" alt=""></button>`).join('')}</div>`:''}</div>
  <h3>${esc(p.name)}</h3><div class="pr">${priceTxt(p)}</div><p>${esc(p.desc)}</p>
  ${optGroup(CFG.L1,p.options,'o',sel.opt)}${optGroup(CFG.L2,p.options2,'o2',sel.opt2)}
  ${p.qty>0?`<span class="lbl">الكمية</span><div class="row"><div class="qty"><button data-q="-1" aria-label="أقل">&minus;</button><span id="qv">1</span><button data-q="1" aria-label="أكثر">+</button></div><span class="stock">${p.qty<=5?`المتوفر ${p.qty} فقط`:'متوفر'}</span></div><div id="pmsg"></div><button class="btn" style="width:100%;margin-top:16px" id="addBtn">أضيفي إلى السلة</button>`
  :'<div class="msg err">هذا المنتج غير متوفر حالياً. راسلينا على واتساب لنخبرك عند توفره.</div>'}</div>`;
  open('ovProd');
  const body=$('#prodBody');
  body.onclick=e=>{
    const th=e.target.closest('[data-th]');
    if(th){$('#gMain').src=im[th.dataset.th];$$('[data-th]').forEach(b=>b.setAttribute('aria-current',b===th));return}
    const o=e.target.closest('[data-o]');
    if(o){sel.opt=o.dataset.o;$$('[data-o]').forEach(b=>b.setAttribute('aria-pressed',b===o));return}
    const o2=e.target.closest('[data-o2]');
    if(o2){sel.opt2=o2.dataset.o2;$$('[data-o2]').forEach(b=>b.setAttribute('aria-pressed',b===o2));return}
    const q=e.target.closest('[data-q]');
    if(q){sel.qty=Math.min(p.qty,Math.max(1,sel.qty+Number(q.dataset.q)));$('#qv').textContent=sel.qty;return}
    if(e.target.id==='addBtn'){
      if((p.options&&p.options.length&&!sel.opt)||(p.options2&&p.options2.length&&!sel.opt2)){$('#pmsg').innerHTML='<div class="msg err">اختاري الخيارات المطلوبة أولاً.</div>';return}
      const key=[sel.opt,sel.opt2].filter(Boolean).join(' / ')||null;
      const ex=cart.find(c=>c.pid===p.id&&c.opt===key);
      const have=ex?ex.qty:0;
      if(have+sel.qty>p.qty){$('#pmsg').innerHTML=`<div class="msg err">المتوفر ${p.qty} فقط، وعندك ${have} بالسلة.</div>`;return}
      if(ex)ex.qty+=sel.qty;else cart.push({pid:p.id,opt:key,qty:sel.qty});
      lsSet('shoes_cart',cart);renderCartCount();close('ovProd');toast('انضافت للسلة 👟');
    }
  };
}

/* سلة */
const cartTotal=()=>cart.reduce((s,c)=>s+byId(c.pid).price*c.qty,0);
function renderCartCount(){$('#cartCount').textContent=cart.reduce((s,c)=>s+c.qty,0)}
$('#openCart').onclick=()=>{renderCart();open('ovCart')};
function renderCart(){
  const b=$('#cartBody');
  if(!cart.length){b.innerHTML='<p class="empty" style="grid-column:auto">السلة فاضية. اختاري منتجاتك وارجعي.</p>';return}
  b.innerHTML=cart.map((c,i)=>{const p=byId(c.pid);return `<div class="line"><img src="${esc(imgs(p)[0])}" alt=""><div><div class="t">${esc(p.name)}</div><div class="s">${c.opt?esc(c.opt)+' · ':''}${priceTxt(p)}</div><div class="qty" style="margin-top:4px"><button data-i="${i}" data-d="-1" aria-label="أقل">&minus;</button><span>${c.qty}</span><button data-i="${i}" data-d="1" aria-label="أكثر">+</button></div></div><button class="btn sm ghost" data-rm="${i}">حذف</button></div>`}).join('')
  +`<div class="total"><span>المجموع</span><span>${money(cartTotal())}</span></div><p class="stock">سعر التوصيل بنأكده معك على واتساب حسب منطقتك.</p><button class="btn" style="width:100%;margin-top:12px" id="toCheckout">متابعة الطلب</button>`;
}
$('#cartBody').addEventListener('click',e=>{
  const d=e.target.closest('[data-d]'),r=e.target.closest('[data-rm]');
  if(d){const c=cart[d.dataset.i],p=byId(c.pid);c.qty=Math.min(p.qty,Math.max(1,c.qty+Number(d.dataset.d)));}
  else if(r){cart.splice(r.dataset.rm,1)}
  else if(e.target.id==='toCheckout'){return renderCheckout()}
  else return;
  lsSet('shoes_cart',cart);renderCart();renderCartCount();
});
function renderCheckout(){
  const saved=lsGet('shoes_cust',{});
  $('#cartBody').innerHTML=`<form id="coForm" novalidate>
  <div class="f"><label for="cn">الاسم</label><input id="cn" required value="${esc(saved.name||'')}" autocomplete="name"></div>
  <div class="f"><label for="cp">رقم الجوال</label><input id="cp" type="tel" inputmode="tel" required value="${esc(saved.phone||'')}" autocomplete="tel" placeholder="059xxxxxxx"></div>
  <div class="f"><label for="cc">المدينة والعنوان</label><input id="cc" required value="${esc(saved.addr||'')}" autocomplete="street-address" placeholder="مثال: نابلس، رفيديا، شارع..."></div>
  <div class="f"><label for="cx">ملاحظات (اختياري)</label><textarea id="cx"></textarea></div>
  <div id="coErr"></div>
  <div class="total"><span>المجموع</span><span>${money(cartTotal())}</span></div>
  <button class="btn wa" style="width:100%" type="submit">ثبّتي الطلب وأرسليه على واتساب</button>
  <button type="button" class="btn ghost" style="width:100%;margin-top:8px" id="backCart">رجوع للسلة</button></form>`;
  $('#backCart').onclick=renderCart;
  $('#coForm').onsubmit=submitOrder;
}
function orderNo(){const d=new Date();return CFG.PREFIX+'-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.floor(1000+Math.random()*9000)}
function submitOrder(e){
  e.preventDefault();
  const name=$('#cn').value.trim(),phone=$('#cp').value.trim(),addr=$('#cc').value.trim(),note=$('#cx').value.trim();
  if(!name||!/^[0-9+\s-]{9,15}$/.test(phone)||!addr){$('#coErr').innerHTML='<div class="msg err">عبّي الاسم ورقم جوال صحيح والعنوان.</div>';return}
  lsSet('shoes_cust',{name,phone,addr});
  const items=cart.map(c=>{const p=byId(c.pid);return {pid:p.id,name:p.name,opt:c.opt||'',qty:c.qty,price:p.price}});
  const total=cartTotal(), no=orderNo(), date=new Date().toISOString();
  const lines=items.map((it,i)=>`${i+1}) ${it.name}${it.opt?` (${it.opt})`:''} × ${it.qty} = ${it.price*it.qty} ${CFG.CURRENCY}`).join('\n');
  const text=`طلب جديد من ${CFG.STORE} 👟\nرقم الطلب: ${no}\n\nالاسم: ${name}\nالجوال: ${phone}\nالعنوان: ${addr}\n\n${lines}\n\nالمجموع: ${total} ${CFG.CURRENCY}${note?`\nملاحظات: ${note}`:''}`;
  const order={no,date,name,phone,addr,note,items,total,status:'جديد',deducted:false,text};
  const orders=lsGet('shoes_orders',[]);orders.unshift(order);lsSet('shoes_orders',orders);
  if(CFG.SHEETS_URL){try{fetch(CFG.SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({no,date,name,phone,addr,note,total,items:lines})})}catch(err){}}
  const url=`https://wa.me/${CFG.WHATSAPP}?text=${encodeURIComponent(text)}`;
  cart=[];lsSet('shoes_cart',cart);renderCartCount();
  $('#cartBody').innerHTML=`<div class="done"><div style="font-size:2.4rem">👟</div><h3>تم تثبيت طلبك</h3><div class="no">${esc(no)}</div><p>احتفظي برقم الطلب. إذا ما انفتح واتساب، اضغطي الزر وأرسلي الرسالة لنأكد طلبك.</p><a class="btn wa" style="margin-top:12px" href="${esc(url)}" target="_blank" rel="noopener">إرسال الطلب على واتساب</a></div>`;
  window.open(url,'_blank');
}

/* ============ لوحة الإدارة ============ */
$('#igLink').href=CFG.INSTAGRAM;
let adminTab='products', editing=null, formImgs=[];
function openAdmin(){
  if(sessionStorage.getItem('shoes_admin')!=='1'){
    const pw=prompt('كلمة سر الإدارة:');
    if(pw!==CFG.ADMIN_PASSWORD){if(pw!==null)toast('كلمة السر غير صحيحة');return}
    sessionStorage.setItem('shoes_admin','1');
  }
  $('#adm').classList.add('open');renderAdmin();
}
$('#adminLink').onclick=openAdmin;
$('#adminLink').onkeydown=e=>{if(e.key==='Enter')openAdmin()};
$('#admClose').onclick=()=>{$('#adm').classList.remove('open');if(location.hash==='#admin')history.replaceState(null,'',location.pathname)};
$('#admTabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;adminTab=b.dataset.tab;editing=null;renderAdmin()};
const saveProducts=()=>{if(lsSet('shoes_draft',products)){renderChips();renderGrid()}};

function renderAdmin(){
  $$('#admTabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===adminTab));
  ({products:admProducts,orders:admOrders,publish:admPublish})[adminTab]();
}
function admProducts(){
  const b=$('#admBody');
  if(editing!==null){return admForm()}
  b.innerHTML=`<div class="row" style="margin-bottom:12px"><strong>${products.length} منتج</strong><button class="btn sm" id="newP">+ منتج جديد</button></div>`+
  products.map(p=>`<div class="arow"><img src="${esc(imgs(p)[0])}" alt=""><div><div>${esc(p.name)}</div><div class="m">${esc(p.cat)} · ${priceTxt(p)} · الكمية: ${p.qty}</div></div><div style="display:flex;gap:6px"><button class="btn sm ghost" data-ed="${esc(p.id)}">تعديل</button><button class="btn sm danger" data-del="${esc(p.id)}">حذف</button></div></div>`).join('');
  $('#newP').onclick=()=>{editing='new';formImgs=[];renderAdmin()};
  b.onclick=e=>{
    const ed=e.target.closest('[data-ed]'),dl=e.target.closest('[data-del]');
    if(ed){editing=ed.dataset.ed;formImgs=[...(byId(editing).imgs||[])];renderAdmin()}
    if(dl&&confirm('حذف هذا المنتج؟')){products=products.filter(p=>p.id!==dl.dataset.del);saveProducts();renderAdmin();toast('تم الحذف')}
  };
}
function admForm(){
  const p=editing==='new'?{name:'',cat:CATS[0],price:'',qty:'',options:[],desc:''}:byId(editing);
  const cats=[...new Set([...CATS,...products.map(x=>x.cat)])];
  $('#admBody').innerHTML=`<form id="pf" novalidate><h3 style="margin-bottom:10px">${editing==='new'?'منتج جديد':'تعديل المنتج'}</h3>
  <div class="f"><label for="pn">اسم المنتج</label><input id="pn" required value="${esc(p.name)}"></div>
  <div class="two"><div class="f"><label for="pc">التصنيف</label><select id="pc">${cats.map(c=>`<option ${c===p.cat?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ تصنيف جديد...</option></select></div>
  <div class="f"><label for="pp">السعر (${CFG.CURRENCY})</label><input id="pp" type="number" min="0" step="0.5" required value="${esc(p.price)}"></div></div>
  <div class="two"><div class="f"><label for="pq">الكمية المتوفرة</label><input id="pq" type="number" min="0" step="1" required value="${esc(p.qty)}"></div>
  <div class="f"><label for="po">${esc(CFG.L1)} (افصلي بفاصلة)</label><input id="po" placeholder="مثال: S، M، L" value="${esc((p.options||[]).join('، '))}"></div></div>
  <div class="two"><div class="f"><label for="po2">${esc(CFG.L2)} (افصلي بفاصلة، اختياري)</label><input id="po2" placeholder="مثال: أسود، بيج" value="${esc((p.options2||[]).join('، '))}"></div>
  <div class="f"><label for="pu">الوحدة (اختياري)</label><input id="pu" placeholder="كغم، علبة، قطعة" value="${esc(p.unit||'')}"></div></div>
  <div class="f"><label for="pd">وصف المنتج</label><textarea id="pd">${esc(p.desc)}</textarea></div>
  <div class="f"><label>الصور (حتى 4)</label><input id="pi" type="file" accept="image/*" multiple><div class="upl" id="upl"></div></div>
  <div id="pe"></div>
  <div class="row"><button class="btn" type="submit">حفظ</button><button class="btn ghost" type="button" id="cancelP">إلغاء</button></div></form>`;
  const drawImgs=()=>{$('#upl').innerHTML=formImgs.map((s,i)=>`<div class="it"><img src="${s}" alt=""><button type="button" data-x="${i}" aria-label="حذف الصورة">&times;</button></div>`).join('')};drawImgs();
  $('#upl').onclick=e=>{const x=e.target.closest('[data-x]');if(x){formImgs.splice(x.dataset.x,1);drawImgs()}};
  $('#cancelP').onclick=()=>{editing=null;renderAdmin()};
  $('#pc').onchange=e=>{if(e.target.value==='__new'){const n=prompt('اسم التصنيف الجديد:');if(n&&n.trim()){const o=new Option(n.trim(),n.trim(),true,true);e.target.insertBefore(o,e.target.lastElementChild)}else e.target.selectedIndex=0}};
  $('#pi').onchange=async e=>{
    for(const f of e.target.files){if(formImgs.length>=4)break;formImgs.push(await shrink(f))}
    e.target.value='';drawImgs();
  };
  $('#pf').onsubmit=ev=>{
    ev.preventDefault();
    const name=$('#pn').value.trim(),price=parseFloat($('#pp').value),qty=parseInt($('#pq').value,10);
    if(!name||isNaN(price)||price<0||isNaN(qty)||qty<0){$('#pe').innerHTML='<div class="msg err">عبّي الاسم والسعر والكمية بشكل صحيح.</div>';return}
    const data={name,cat:$('#pc').value,price,qty,options:$('#po').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean),options2:$('#po2').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean),unit:$('#pu').value.trim(),desc:$('#pd').value.trim(),imgs:formImgs};
    if(editing==='new')products.unshift({id:'p'+Date.now().toString(36),...data});
    else Object.assign(byId(editing),data);
    saveProducts();editing=null;renderAdmin();toast('تم الحفظ');
  };
}
function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const M=640,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};
    r.readAsDataURL(file);
  });
}
function admOrders(){
  const orders=lsGet('shoes_orders',[]), b=$('#admBody');
  b.innerHTML=`<div class="msg">هون بتظهر الطلبات اللي انعملت من هذا الجهاز فقط. السجل الكامل لكل الزبائن بيوصلك على واتساب، وبالجدول لو فعّلتي Google Sheets.</div>`+
  (orders.length?orders.map((o,i)=>`<div class="ord"><div class="row"><strong>${esc(o.no)}</strong><span>${esc(o.status)}</span></div><div class="m">${new Date(o.date).toLocaleString('ar')}</div><pre>${esc(o.text)}</pre><div style="display:flex;gap:6px;flex-wrap:wrap">
  <button class="btn sm" data-st="${i}" data-v="مؤكد">تأكيد</button><button class="btn sm ghost" data-st="${i}" data-v="تم التوصيل">تم التوصيل</button><button class="btn sm ghost" data-ded="${i}" ${o.deducted?'disabled':''}>خصم من المخزون</button><button class="btn sm danger" data-rm="${i}">حذف</button></div></div>`).join(''):'<p class="empty" style="grid-column:auto">لا توجد طلبات بعد.</p>')+
  (orders.length?'<button class="btn ghost" id="csv" style="margin-top:8px">تنزيل الطلبات (CSV)</button>':'');
  b.onclick=e=>{
    const st=e.target.closest('[data-st]'),dd=e.target.closest('[data-ded]'),rm=e.target.closest('[data-rm]');
    if(st){orders[st.dataset.st].status=st.dataset.v}
    else if(dd){const o=orders[dd.dataset.ded];o.items.forEach(it=>{const p=byId(it.pid);if(p)p.qty=Math.max(0,p.qty-it.qty)});o.deducted=true;saveProducts();toast('تم خصم الكميات')}
    else if(rm){if(!confirm('حذف الطلب من هذا الجهاز؟'))return;orders.splice(rm.dataset.rm,1)}
    else if(e.target.id==='csv'){
      const rows=[['رقم الطلب','التاريخ','الاسم','الجوال','العنوان','المنتجات','المجموع','الحالة'],...orders.map(o=>[o.no,o.date,o.name,o.phone,o.addr,o.items.map(i=>`${i.name}${i.opt?' ('+i.opt+')':''} x${i.qty}`).join(' | '),o.total,o.status])];
      download('orders.csv','\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');return;
    } else return;
    lsSet('shoes_orders',orders);admOrders();
  };
}
function admPublish(){
  $('#admBody').innerHTML=`<div class="msg">تعديلاتك بتنحفظ على جهازك كمسودة. عشان الزبائن يشوفوها، نزّلي الملف ورفعيه على GitHub.</div>
  <ol style="padding-inline-start:20px;display:grid;gap:6px;margin-bottom:14px"><li>اضغطي «تنزيل products.json».</li><li>افتحي مستودع الموقع على GitHub &larr; Add file &larr; Upload files.</li><li>ارفعي الملف بنفس الاسم <b>products.json</b> بجانب index.html، واضغطي Commit.</li><li>بعد دقيقة أو دقيقتين بتظهر التعديلات للجميع.</li></ol>
  <div style="display:grid;gap:10px;max-width:360px">
  <button class="btn" id="exp">تنزيل products.json</button>
  <label class="btn ghost" style="cursor:pointer">استيراد products.json<input id="imp" type="file" accept=".json" hidden></label>
  <button class="btn ghost" id="rst">الرجوع للمنتجات المنشورة (حذف المسودة)</button></div>`;
  $('#exp').onclick=()=>download('products.json',JSON.stringify(products,null,1),'application/json');
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;products=d;saveProducts();toast('تم الاستيراد')}catch(x){toast('الملف غير صالح')}};r.readAsText(f)};
  $('#rst').onclick=async()=>{if(!confirm('بتنحذف التعديلات غير المنشورة. متأكدة؟'))return;localStorage.removeItem('shoes_draft');await load();toast('تم')};
}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

if(location.hash==='#admin')setTimeout(openAdmin,300);
load();
</script>
</body>
</html>
